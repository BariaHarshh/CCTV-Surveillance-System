# Crowd Detection Preset Settings

model_path: "models/yolov8n.pt"                          # YOLO model weights
confidence_threshold: 0.35              # Min detection confidence (0.0 - 1.0)
tracker_type: "bytetrack.yaml"           # Object tracker configuration
frame_skip: 2                           # Process every Nth frame (1=all frames, 2=smooth 2x boost)

video_path: "videos/stock/sample3.mp4"                   # Video source path
enabled: true                           # Enable/disable crowd detection analytics

# Count Stabilization
count_smoothing_window: 15               # Rolling window size (frames) for median smoothing
count_drop_confirmation_seconds: 1.0    # Seconds low count must persist before dropping stable count

# Default Crowd Thresholds
person_threshold: 5                     # Min people count to start crowd check
persistence_seconds: 3.0                 # Seconds threshold must be held for crowd alert

# Assigned Camera Feeds add new cameras here
cameras:
  - camera_id: "CAM-01"
    name: "Canteen Quad"
    location: "Campus Central Canteen"
    video_path: "videos/stock/sample.mp4"
    enabled: true
    person_threshold: 6
    persistence_seconds: 2.0
