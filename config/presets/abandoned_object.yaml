# AI Campus Guard - Abandoned Object Detection Configuration Preset

# Core Paths
model_path: "models/yolov8n.pt"
output_path: null

# Detection & Tracking Parameters
confidence_threshold: 0.35
tracker_type: "bytetrack.yaml"
frame_skip: 2
inference_size: 640

# Abandoned Object Feature Parameters
enabled: true

stationary_threshold_px: 14.0       # Max pixel movement displacement within window to be stationary
stationary_window_seconds: 2.0      # Duration required to confirm stationary state
person_proximity_threshold_px: 130.0 # Max pixel distance from object center to nearest person
stale_track_timeout_seconds: 5.0    # Seconds before deleting a lost object track history

# Assigned Camera Feeds add new cameras here 
cameras:
  - camera_id: "CAM-04"
    name: "Main Lobby"
    location: "Administration Building Entrance"
    video_path: "videos/stock/sample7.mp4"
    enabled: true

# Tier-2 Prolonged Abandonment Escalation (20 to 30 min in production, 25s in demo)
escalation_unattended_seconds: 1200.0  # 20 minutes in seconds
demo_escalation_seconds: 25.0          # 25 seconds in demo mode
use_demo_escalation: false

# On-Duty Staff Directory per Campus Area
area_staff_directory:
  "Campus Public Area":
    staff_name: "Officer R. Sharma"
    role: "Ground Floor Warden"
    contact: "Ext 402 / Radio Ch-3"
  "Library 2nd Floor":
    staff_name: "Anita Desai"
    role: "Library Supervisor"
    contact: "Ext 214 / Radio Ch-2"
  "Cafeteria Courtyard":
    staff_name: "Vikram Singh"
    role: "Courtyard Security"
    contact: "Ext 305 / Radio Ch-4"
  "default":
    staff_name: "Area Duty Officer"
    role: "Central Campus Patrol"
    contact: "Ext 100 / Emergency Ch-1"

# Per-Category Abandonment Rules
object_rules:
  backpack:
    unattended_seconds: 15.0
    risk_score: 70
    severity: "high"
    display_name: "BACKPACK"

  handbag:
    unattended_seconds: 15.0
    risk_score: 65
    severity: "medium"
    display_name: "HANDBAG"

  suitcase:
    unattended_seconds: 15.0
    risk_score: 80
    severity: "critical"
    display_name: "SUITCASE"

  bottle:
    unattended_seconds: 30.0
    risk_score: 20
    severity: "low"
    display_name: "BOTTLE"
