# ==============================================================================
# AI Campus Guard - Risk Management Preset: High Security Facility Mode
# Aggressive Multi-Threat Escalation & Immediate Emergency Alerts
# ==============================================================================

# Core System Paths & Pipeline
model_path: "models/yolov8n.pt"
video_path: "videos/stock/sample.mp4"
output_path: null

confidence_threshold: 0.30
tracker_type: "bytetrack.yaml"
frame_skip: 1
inference_size: 640

# Risk Management Master Orchestration
risk_management:
  enabled: true
  demo_mode: false

  performance:
    target_fps: 30.0
    feature_intervals:
      crowd_detection: 1
      behavior_detection: 1
      abandoned_object: 1
      restricted_area: 1

  features:
    crowd_detection:
      enabled: true
    behavior_detection:
      enabled: true
    abandoned_object:
      enabled: true
    restricted_area:
      enabled: true

# Risk Assessment Aggressive Threat Scoring
risk_assessment:
  enabled: true
  low_max: 20
  medium_max: 40
  high_max: 65
  critical_max: 100

  persistence_enabled: true
  persistence_rate_per_10s: 8.0
  max_persistence_bonus: 20.0

  escalation_enabled: true
  escalation_time_window_seconds: 20.0

  decay_enabled: true
  decay_rate_per_second: 1.5
  inactive_timeout_seconds: 8.0
  resolution_timeout_seconds: 24.0

restricted_area:
  zones:
    - name: "HIGH SECURITY RESTRICTED VAULT"
      enabled: true
      severity: "critical"
      points: [[40, 120], [380, 120], [380, 340], [40, 340]]
