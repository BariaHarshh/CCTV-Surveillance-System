# ==============================================================================
# AI Campus Guard - Risk Management Preset: Lightweight Edge Optimization Mode
# Active: Crowd Detection & Restricted Area (Low-power / High-FPS Profile)
# ==============================================================================

# Core System Paths & Pipeline
model_path: "models/yolov8n.pt"
video_path: "videos/stock/sample.mp4"
output_path: null

confidence_threshold: 0.40
tracker_type: "bytetrack.yaml"
frame_skip: 3
inference_size: 416        # Fast edge-optimized input size

# Risk Management Master Orchestration
risk_management:
  enabled: true
  demo_mode: false

  performance:
    target_fps: 30.0
    feature_intervals:
      crowd_detection: 1
      behavior_detection: 3
      abandoned_object: 3
      restricted_area: 1

  features:
    crowd_detection:
      enabled: true        # Fast count stabilization
    behavior_detection:
      enabled: false       # Disabled to save CPU/GPU cycles
    abandoned_object:
      enabled: false       # Disabled to save CPU/GPU cycles
    restricted_area:
      enabled: true        # Fast polygon geometry checks

# Risk Assessment Threat Scoring Configuration
risk_assessment:
  enabled: true
  low_max: 24
  medium_max: 49
  high_max: 74
  critical_max: 100

  persistence_enabled: true
  escalation_enabled: true
  decay_enabled: true

crowd:
  person_threshold: 12
  persistence_seconds: 3.0

restricted_area:
  zones:
    - name: "CAMPUS ENTRY GATE RESTRICTED ZONE"
      enabled: true
      severity: "high"
      points: [[50, 150], [350, 150], [350, 320], [50, 320]]
