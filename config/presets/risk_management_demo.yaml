# ==============================================================================
# AI Campus Guard - Risk Management Preset: TechVerse Competition Demo Mode
# Rapid Multi-Threat Evaluation & Fast Timers
# ==============================================================================

# Core System Paths & Pipeline
model_path: "models/yolov8n.pt"
video_path: "videos/stock/sample.mp4"
output_path: null

confidence_threshold: 0.35
tracker_type: "bytetrack.yaml"
frame_skip: 2
inference_size: 512

# Risk Management Master Orchestration
risk_management:
  enabled: true
  demo_mode: true          # Enables accelerated demonstration timers

  performance:
    target_fps: 30.0
    feature_intervals:
      crowd_detection: 1
      behavior_detection: 1
      abandoned_object: 1
      restricted_area: 1

  features:
    crowd_detection:
      enabled: true
    behavior_detection:
      enabled: true
    abandoned_object:
      enabled: true
    restricted_area:
      enabled: true

# Risk Assessment Threat Scoring Configuration
risk_assessment:
  enabled: true
  low_max: 24
  medium_max: 49
  high_max: 74
  critical_max: 100

  persistence_enabled: true
  persistence_rate_per_10s: 8.0
  max_persistence_bonus: 20.0

  escalation_enabled: true
  escalation_time_window_seconds: 15.0

  decay_enabled: true
  decay_rate_per_second: 3.0
  inactive_timeout_seconds: 4.0
  resolution_timeout_seconds: 12.0

# Shortened Timers for Rapid Live Demonstration
crowd:
  person_threshold: 8
  persistence_seconds: 1.5

abandoned_object:
  stationary_threshold_px: 14.0
  stationary_window_seconds: 1.5
  object_rules:
    backpack:
      unattended_seconds: 5.0
      risk_score: 70
      severity: "high"
      display_name: "BACKPACK"
    bottle:
      unattended_seconds: 10.0
      risk_score: 20
      severity: "low"
      display_name: "BOTTLE"

restricted_area:
  zones:
    - name: "NORTH CORRIDOR RESTRICTED ZONE"
      enabled: true
      severity: "critical"
      points: [[50, 150], [350, 150], [350, 320], [50, 320]]
