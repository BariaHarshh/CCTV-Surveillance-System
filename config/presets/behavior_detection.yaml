# Behavior Detection Preset Settings (Calibrated for High Accuracy)

# File Paths
model_path: "models/yolov8n.pt"                          # YOLO model weights file
video_path: "videos/stock/sample.mp4"                    # Input video source

# Detection & Tracking
confidence_threshold: 0.35              # Min detection confidence (0.0 - 1.0)
tracker_type: "bytetrack.yaml"           # Multi-object tracker configuration
frame_skip: 2                           # Frame skip cadence (1=every frame, 2=smooth 2x boost)

# Behavior Detection Core Settings
enabled: true                           # Enable/disable overall behavior analytics
history_seconds: 3.0                    # Movement history memory duration (seconds)
history_max_frames: 75                  # Max tracked frames stored per person
track_inactivity_timeout_seconds: 2.0   # Time before purging lost person track
camera_id: "CAM-01"                     # Surveillance camera identifier tag
location: "Campus Grounds"              # Camera location/zone description

# Fall Detection Settings (Calibrated for High Recall on Fallen Postures)
fall:
  enabled: true                         # Enable fall detection module
  aspect_ratio_threshold: 0.92          # Body width/height ratio for horizontal/collapsed posture
  aspect_ratio_expansion_ratio: 1.4     # Relative body widening factor during fall
  vertical_drop_ratio: 0.28             # Proportional drop in box height (28%)
  vertical_velocity_threshold: 60.0     # Min downward speed (px/sec) during collapse
  immobility_speed_threshold: 60.0      # Max speed on ground (px/sec) to confirm fallen posture
  persistence_seconds: 0.6              # Seconds fallen posture must persist
  confidence_threshold: 0.50            # Min confidence score for fall alert
  cooldown_seconds: 5.0                 # Seconds cooldown between repeat alerts

# Aggressive Movement Settings (Calibrated against False Sprinting / Jogging Alarms)
movement:
  enabled: true                         # Enable aggressive movement detection
  speed_threshold: 320.0                # Speed (px/sec) for extreme sprinting/fleeing only
  acceleration_threshold: 280.0         # Acceleration (px/sec^2) for sudden erratic bursts
  direction_volatility_threshold: 75.0  # Heading variation angle (deg) for erratic zigzag paths
  persistence_seconds: 1.2              # Seconds erratic motion must persist
  confidence_threshold: 0.65            # Min confidence score for movement alert
  cooldown_seconds: 8.0                 # Seconds cooldown between repeat alerts for same person

# Fight / Altercation Detection Settings (Balanced to Prevent False Pass-By Alerts)
fight:
  enabled: true                         # Enable fighting altercation detection
  proximity_threshold: 150.0            # Max center-to-center distance (px) for close interaction
  convergence_speed_threshold: 60.0     # Approach speed (px/sec) when closing in
  mutual_speed_threshold: 160.0         # Combined movement speed (px/sec) during struggle
  mutual_accel_threshold: 160.0         # Combined acceleration (px/sec^2) during struggle/pushing
  persistence_seconds: 1.0              # Seconds close struggle must persist (1.0s)
  confidence_threshold: 0.65            # Min confidence score for fight alert
  cooldown_seconds: 6.0                 # Seconds cooldown between repeat alerts
