# ==============================================================================
# AI Campus Guard - Risk Management Preset: Balanced
# Person detection every frame, Behaviour every 2 frames, Objects every 3 frames
# ==============================================================================

model_path: "models/yolov8n.pt"
video_path: "videos/stock/sample.mp4"
output_path: null

confidence_threshold: 0.40
tracker_type: "bytetrack.yaml"
frame_skip: 1
inference_size: 512

risk_management:
  enabled: true
  demo_mode: false

  performance:
    target_fps: 30.0
    feature_intervals:
      person_detection: 1
      crowd_detection: 1
      behavior_detection: 2
      abandoned_object: 3
      restricted_area: 1

  features:
    crowd_detection:
      enabled: true
    behavior_detection:
      enabled: true
    abandoned_object:
      enabled: true
    restricted_area:
      enabled: true

risk_assessment:
  enabled: true
  low_max: 24
  medium_max: 49
  high_max: 74
  critical_max: 100

  persistence_enabled: true
  persistence_rate_per_10s: 5.0
  max_persistence_bonus: 15.0

  escalation_enabled: true
  escalation_time_window_seconds: 15.0

  decay_enabled: true
  decay_rate_per_second: 2.0
  inactive_timeout_seconds: 6.0
  resolution_timeout_seconds: 18.0

crowd:
  person_threshold: 10
  persistence_seconds: 3.0

restricted_area:
  zones:
    - name: "NORTH CORRIDOR RESTRICTED ZONE"
      enabled: true
      severity: "critical"
      points: [[50, 150], [350, 150], [350, 320], [50, 320]]
