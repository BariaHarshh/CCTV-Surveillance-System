# ==============================================================================
# AI Campus Guard - Risk Management Preset: Behaviour & Violence Focused Mode
# Active: Behaviour Detection & Restricted Area (Crowd & Abandoned Object Disabled)
# ==============================================================================

# Core System Paths & Pipeline
model_path: "models/yolov8n.pt"
video_path: "videos/stock/sample.mp4"
output_path: null

confidence_threshold: 0.35
tracker_type: "bytetrack.yaml"
frame_skip: 2
inference_size: 640

# Risk Management Master Orchestration
risk_management:
  enabled: true
  demo_mode: false

  performance:
    target_fps: 30.0
    feature_intervals:
      crowd_detection: 1
      behavior_detection: 2
      abandoned_object: 2
      restricted_area: 1

  features:
    crowd_detection:
      enabled: false       # Zero processing/tracking overhead
    behavior_detection:
      enabled: true        # Active fighting, aggression, and fall detection
    abandoned_object:
      enabled: false       # Zero object inference/tracking overhead
    restricted_area:
      enabled: true        # Active perimeter security breach detection

# Risk Assessment Threat Scoring Configuration
risk_assessment:
  enabled: true
  low_max: 24
  medium_max: 49
  high_max: 74
  critical_max: 100

  persistence_enabled: true
  persistence_rate_per_10s: 6.0
  max_persistence_bonus: 15.0

  escalation_enabled: true
  escalation_time_window_seconds: 15.0

restricted_area:
  zones:
    - name: "NORTH CORRIDOR RESTRICTED ZONE"
      enabled: true
      severity: "critical"
      points: [[50, 150], [350, 150], [350, 320], [50, 320]]
