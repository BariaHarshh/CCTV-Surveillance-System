name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test --if-present
      - run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/ai-campus-guardian-ci
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret-at-least-32-chars
