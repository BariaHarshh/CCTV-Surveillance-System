services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      MONGODB_URI: mongodb://mongo:27017/ai-campus-guardian
      NODE_ENV: production
    depends_on:
      - mongo

volumes:
  mongo_data:
